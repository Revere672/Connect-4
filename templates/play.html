<!DOCTYPE html>
<html>
    <head>
        <title>Connect 4</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='styles/gameboard_style.css') }}">
    </head>
    <body>
        <h1 class="turn-text" id="turnText">Red's Turn</h1>
        <button type="button" class="btn-reset">Reset</button>
        <div id="container">
            <div id="grid">
                <div class="row">
                    <div class="circle" id="circle-0-0"></div>
                    <div class="circle" id="circle-0-1"></div>
                    <div class="circle" id="circle-0-2"></div>
                    <div class="circle" id="circle-0-3"></div>
                    <div class="circle" id="circle-0-4"></div>
                    <div class="circle" id="circle-0-5"></div>
                    <div class="circle" id="circle-0-6"></div>
                </div>
                <div class="row">
                    <div class="circle" id="circle-1-0"></div>
                    <div class="circle" id="circle-1-1"></div>
                    <div class="circle" id="circle-1-2"></div>
                    <div class="circle" id="circle-1-3"></div>
                    <div class="circle" id="circle-1-4"></div>
                    <div class="circle" id="circle-1-5"></div>
                    <div class="circle" id="circle-1-6"></div>
                </div>
                <div class="row">
                    <div class="circle" id="circle-2-0"></div>
                    <div class="circle" id="circle-2-1"></div>
                    <div class="circle" id="circle-2-2"></div>
                    <div class="circle" id="circle-2-3"></div>
                    <div class="circle" id="circle-2-4"></div>
                    <div class="circle" id="circle-2-5"></div>
                    <div class="circle" id="circle-2-6"></div>
                </div>
                <div class="row">
                    <div class="circle" id="circle-3-0"></div>
                    <div class="circle" id="circle-3-1"></div>
                    <div class="circle" id="circle-3-2"></div>
                    <div class="circle" id="circle-3-3"></div>
                    <div class="circle" id="circle-3-4"></div>
                    <div class="circle" id="circle-3-5"></div>
                    <div class="circle" id="circle-3-6"></div>
                </div>
                <div class="row">
                    <div class="circle" id="circle-4-0"></div>
                    <div class="circle" id="circle-4-1"></div>
                    <div class="circle" id="circle-4-2"></div>
                    <div class="circle" id="circle-4-3"></div>
                    <div class="circle" id="circle-4-4"></div>
                    <div class="circle" id="circle-4-5"></div>
                    <div class="circle" id="circle-4-6"></div>
                </div>
                <div class="row">
                    <div class="circle" id="circle-5-0"></div>
                    <div class="circle" id="circle-5-1"></div>
                    <div class="circle" id="circle-5-2"></div>
                    <div class="circle" id="circle-5-3"></div>
                    <div class="circle" id="circle-5-4"></div>
                    <div class="circle" id="circle-5-5"></div>
                    <div class="circle" id="circle-5-6"></div>
                </div>
            </div>
            <div class="selected-grid">
                <div class="selected-col" id="col-0"></div>
                <div class="selected-col" id="col-1"></div>
                <div class="selected-col" id="col-2"></div>
                <div class="selected-col" id="col-3"></div>
                <div class="selected-col" id="col-4"></div>
                <div class="selected-col" id="col-5"></div>
                <div class="selected-col" id="col-6"></div>
            </div>
        </div>
        <script src="{{ url_for('static', filename='scripts/placeToken.js') }}"></script>
    </body>
</html>
